services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: archy
      POSTGRES_USER: archy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archy -d archy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
